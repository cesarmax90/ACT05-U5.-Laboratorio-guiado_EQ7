name: CI Business Logic
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - run: python -m compileall -q src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htmlcov
          path: htmlcov

  pia_novarent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pia_novarent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ../requirements.txt
      - run: python -m ruff check novarent tests
      - run: python -m pytest -v --cov=novarent --cov-report=term-missing --cov-fail-under=80
